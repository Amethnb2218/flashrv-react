<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jolof'Era Agence Cut</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="info-panel">
        <p class="eyebrow">Jolof'Era Agence Cut</p>
        <h1>Version 5. Plus agence, plus cinema, plus impact.</h1>
        <p class="lede">
          Cette variante pousse le rendu pub: animation plus spectaculaire,
          mise en scene plus forte, meilleure presence de marque.
        </p>
        <div class="controls">
          <button id="playButton" class="primary">Pause</button>
          <button id="restartButton">Rejouer</button>
          <button id="exportButton">Exporter en WebM</button>
        </div>
        <p id="statusText" class="status">
          Apercu en lecture. Cette version vise un rendu campagne premium.
        </p>
        <div class="compare-box">
          <span>Comparer les versions</span>
          <a href="../styleflowdemo-export/index.html">V1</a>
          <a href="../styleflowdemo-luxe/index.html">V2</a>
          <a href="../styleflowdemo-highend/index.html">V3</a>
          <a href="../styleflowdemo-clair-premium/index.html">V4</a>
        </div>
      </section>

      <section class="stage-shell">
        <canvas id="demoCanvas" width="1080" height="1920"></canvas>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
